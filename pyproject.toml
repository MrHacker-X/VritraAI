[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vritraai"
version = "1.0.2"
description = "AI coding assistant for the terminal - agent loop, multi-file edits, multi-provider models"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Alex Butler", email = "contact@vritrasec.com"}
]
maintainers = [
    {name = "Alex Butler", email = "contact@vritrasec.com"}
]
keywords = ["ai", "coding-agent", "cli", "terminal", "assistant", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Environment :: Console",
]
dependencies = [
    "requests>=2.28.0",
    "prompt-toolkit>=3.0.0",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/MrHacker-X/VritraAI"
Documentation = "https://vritraai.vritrasec.com/"
Repository = "https://github.com/MrHacker-X/VritraAI"
"Bug Reports" = "https://github.com/MrHacker-X/VritraAI/issues"
Website = "https://vritrasec.com"

[project.scripts]
vritraai = "vritraai:main"

[tool.setuptools]
py-modules = ["vritraai"]

[tool.setuptools.packages.find]
include = ["core*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"*" = ["README.md", "LICENSE", "CHANGELOG.md", "requirements.txt"]
